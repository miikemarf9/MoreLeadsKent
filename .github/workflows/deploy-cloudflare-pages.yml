name: Deploy MoreLeads Kent to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: moreleads-kent-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production website
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Assemble only public website files
        run: |
          mkdir -p dist
          cp index.html contact.html privacy.html style.css script.js favicon.svg robots.txt sitemap.xml dist/
          cp -R assets dist/assets
          test -f dist/index.html
          test -f dist/assets/grabandbook.svg
          test -f dist/assets/roomfound.svg
          test -f dist/assets/foxborough.svg

      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, sys
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          if not token:
              sys.exit('TOKEN CHECK FAILED: GitHub secret is missing or empty.')
          if any(x in token.lower() for x in ('curl ', 'authorization:', 'bearer ', 'https://')):
              sys.exit('TOKEN CHECK FAILED: Secret contains the Cloudflare test command, a URL, or header text. Use only the raw token value.')
          if any(ch.isspace() for ch in token):
              sys.exit('TOKEN CHECK FAILED: Secret contains spaces or line breaks. Use only the raw token value.')
          if len(token) < 20 or any(ord(c) < 33 or ord(c) > 126 for c in token):
              sys.exit('TOKEN CHECK FAILED: Secret does not look like a complete API token.')
          print('TOKEN FORMAT OK: Secret has a plausible one-line token; checking Cloudflare authentication next.')
          PY

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Deploy to existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: faf3fd0d8a5e4ea8c386e156046a2933
          command: pages deploy dist --project-name=moreleads-kent --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
